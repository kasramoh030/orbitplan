function defaultLearningDraft(){return{subjects:'زبان، ریاضی، احتمال، پایتون',dailyMinutes:60,months:3,startDate:todayISO(),days:[6,0,1,2,3]}}
function L(fa,en){return state.lang==='fa'?fa:en}
function normalizeLearningText(value){return String(value||'').toLowerCase().replace(/ي/g,'ی').replace(/ك/g,'ک').trim()}
function learningProfile(subject){const n=normalizeLearningText(subject);const base={name:subject,kind:'general',skills:['مبانی و واژگان کلیدی','مفهوم‌های اصلی','تمرین هدفمند','کاربرد واقعی','مرور و آزمونک'],newMethods:['مثال عینی و دوکدگذاری','خودتوضیحی','تمرین هدفمند'],reviewMethods:['بازیابی فعال','مرور فاصله‌دار','آزمونک کوتاه']};if(/زبان|انگلیسی|english|french|german|عربی/.test(n))return{...base,kind:'language',skills:['واژگان و عبارت‌های کاربردی','Listening و درک شنیداری','Reading و درک متن','Speaking و تولید گفتار','Writing و بازخورد نوشتاری','Grammar در بافت'],newMethods:['ورودی قابل‌فهم + مثال','Shadowing و تقلید آوایی','نوشتن با بازخورد'],reviewMethods:['فلش‌کارت و بازیابی فعال','مرور فاصله‌دار واژگان','تولید جمله بدون نگاه']};if(/احتمال|آمار|statistics|probability/.test(n))return{...base,kind:'probability',skills:['فضای نمونه و رویدادها','قوانین احتمال','احتمال شرطی و بیز','متغیر تصادفی','توزیع‌ها و امید ریاضی','حل مسئلهٔ ترکیبی'],newMethods:['مثال حل‌شده + خودتوضیحی','تمرین مرحله‌ای','مسئلهٔ کاربردی'],reviewMethods:['بازیابی فرمول از حافظه','مسئلهٔ درهم‌آمیخته','تحلیل خطا']};if(/ریاضی|math|calculus|جبر|algebra/.test(n))return{...base,kind:'math',skills:['مفهوم و تعریف','مثال حل‌شده','تمرین پایه','تمرین ترکیبی','مسئلهٔ چالشی','دفتر خطا'],newMethods:['خودتوضیحی مراحل حل','مثال حل‌شده','تمرین هدایت‌شده'],reviewMethods:['بازیابی مراحل حل','تمرین درهم‌آمیخته','تحلیل خطا']};if(/پایتون|python|برنامه نویسی|programming|کدنویسی|code/.test(n))return{...base,kind:'programming',skills:['مفهوم و syntax','تمرین کدنویسی کوتاه','ساختار داده و الگوریتم','خواندن و اشکال‌زدایی کد','مینی‌پروژه','بازآرایی و مستندسازی'],newMethods:['کدنویسی از صفر','توضیح کد با صدای بلند','ساخت مینی‌پروژه'],reviewMethods:['بازیابی syntax بدون نگاه','اشکال‌زدایی هدفمند','بازسازی پروژهٔ کوتاه']};return base}
function parseLearningSubjects(text){const list=String(text||'').split(/[،,;\n]+/).map(x=>x.trim()).filter(Boolean);return [...new Map(list.map(x=>[normalizeLearningText(x),x])).values()].slice(0,8)}
function learningDayName(day){const fa={6:'شنبه',0:'یکشنبه',1:'دوشنبه',2:'سه‌شنبه',3:'چهارشنبه',4:'پنجشنبه',5:'جمعه'};const en={6:'Sat',0:'Sun',1:'Mon',2:'Tue',3:'Wed',4:'Thu',5:'Fri'};return state.lang==='fa'?fa[day]:en[day]}
function activeLearningDates(startISO,months,days){const start=asDate(startISO),end=new Date(start);end.setMonth(end.getMonth()+months);end.setDate(end.getDate()-1);const out=[];for(let d=new Date(start);d<=end;d.setDate(d.getDate()+1)){if(days.includes(d.getDay()))out.push(isoFromDate(d))}return out}
function nextActiveOnOrAfter(iso,activeDates){return activeDates.find(d=>d>=iso)}
function seededIndex(seed,length){let h=2166136261;for(const ch of String(seed)){h^=ch.charCodeAt(0);h=Math.imul(h,16777619)}return Math.abs(h>>>0)%Math.max(1,length)}
function studyBlockCount(minutes){return Math.max(1,Math.ceil(Number(minutes||0)/60))}
function studySlotDuration(slot,totalMinutes,slots){const base=Math.floor(totalMinutes/slots),remainder=totalMinutes%slots;return base+(slot<remainder?1:0)}
function studySlotTime(slot,totalMinutes,slots){let minute=8*60;for(let i=0;i<slot;i++){minute+=studySlotDuration(i,totalMinutes,slots)+(i%3===2?45:15)}return `${String(Math.floor(minute/60)).padStart(2,'0')}:${String(minute%60).padStart(2,'0')}`}
function studyBreakLabel(minutes){const blocks=studyBlockCount(minutes);return L(`${uiNumber(blocks)} بلوک مطالعه با استراحت‌های کوتاه و یک استراحت بلند پس از هر ۳ بلوک.`,`${blocks} study blocks with short breaks and a longer break after every 3 blocks.`)}
function captureLearningDraft(){const subjects=document.getElementById('learningSubjects');if(!subjects)return;const hours=Math.min(12,Math.max(0,Number(document.getElementById('learningHours').value)||0));const extra=Number(document.getElementById('learningExtraMinutes').value)||0;state.learningDraft={subjects:subjects.value,dailyMinutes:Math.min(720,Math.max(30,hours*60+extra)),months:Number(document.getElementById('learningMonths').value),startDate:document.getElementById('learningStart').value||todayISO(),days:state.learningDraft.days}}
function setDailyStudyHours(hours){captureLearningDraft();state.learningDraft.dailyMinutes=Math.min(720,Math.max(30,Number(hours)*60));render();save()}
function toggleLearningDay(day){captureLearningDraft();const set=new Set(state.learningDraft.days);set.has(day)?set.delete(day):set.add(day);if(!set.size)set.add(day);state.learningDraft.days=[...set].sort((a,b)=>a-b);render();save()}
function buildLearningPlan(){captureLearningDraft();const draft=state.learningDraft,subjects=parseLearningSubjects(draft.subjects);if(!subjects.length){toast(L('حداقل یک موضوع یادگیری بنویس.','Enter at least one learning subject.'));return}const profiles=subjects.map(learningProfile),active=activeLearningDates(draft.startDate,Math.min(12,Math.max(1,draft.months)),draft.days);if(!active.length){toast(L('روزهای مطالعه را انتخاب کن.','Select study days.'));return}const slots=studyBlockCount(draft.dailyMinutes);const sessionMinutes=studySlotDuration(0,draft.dailyMinutes,slots);const due=new Map(active.map(d=>[d,[]]));const progress=Object.fromEntries(profiles.map(p=>[p.name,0]));const generated=[];let cursor=seededIndex(`${draft.subjects}-${draft.startDate}`,profiles.length),lastSubject='',newCount=0;function placeReview(session,offset){const base=asDate(session.date);base.setDate(base.getDate()+offset);const target=nextActiveOnOrAfter(isoFromDate(base),active);if(target&&target!==session.date)due.get(target).push({...session,type:'review',strategy:'مرور فاصله‌دار + بازیابی فعال',title:`${session.subject} · مرور ${session.skill}`})}for(let dayIndex=0;dayIndex<active.length;dayIndex++){const date=active[dayIndex],dayDue=due.get(date)||[];for(let slot=0;slot<slots;slot++){let session;const useReview=dayDue.length&&(slots>1||dayIndex%3===2||slot>0);if(useReview){session=dayDue.shift();session={...session,date,time:studySlotTime(slot,draft.dailyMinutes,slots),duration:studySlotDuration(slot,draft.dailyMinutes,slots),type:'review'}}else{let profile=profiles[cursor%profiles.length];if(profiles.length>1&&profile.name===lastSubject){cursor++;profile=profiles[cursor%profiles.length]}cursor++;const count=progress[profile.name]++;const skill=profile.skills[count%profile.skills.length];const weeklyCheck=(dayIndex+1)%Math.max(1,draft.days.length)===0&&slot===slots-1;const method=weeklyCheck?'آزمونک تجمعی و تحلیل خطا':profile.newMethods[(count+seededIndex(profile.name+date,profile.newMethods.length))%profile.newMethods.length];session={id:`learn-${date}-${slot}-${newCount++}`,date,time:studySlotTime(slot,draft.dailyMinutes,slots),duration:studySlotDuration(slot,draft.dailyMinutes,slots),subject:profile.name,kind:profile.kind,skill:weeklyCheck?`${skill} · جمع‌بندی هفته`:skill,strategy:method,type:weeklyCheck?'checkpoint':'new'};if(!weeklyCheck)[1,3,7,14,30].forEach(offset=>placeReview(session,offset))}lastSubject=session.subject;generated.push(session)}if(dayDue.length){const next=active[dayIndex+1];if(next)due.get(next).push(...dayDue)}}state.tasks=state.tasks.filter(task=>!task.generatedLearning);const mapped=generated.map((x,i)=>({id:Date.now()+i,title:`${x.subject} · ${x.skill}`,titleEn:`${x.subject} · ${x.skill}`,category:'Study',date:x.date,time:x.time,duration:x.duration,priority:x.type==='checkpoint'?'High':'Medium',done:false,skipped:false,generatedLearning:true,learning:{subject:x.subject,skill:x.skill,strategy:x.strategy,type:x.type}}));state.tasks.push(...mapped);state.learningPlan={createdAt:new Date().toISOString(),draft:{...draft},profiles,sessions:generated};state.learningPlanView='week';save();render();toast(L(`${uiNumber(generated.length)} جلسهٔ یادگیری منطقی ساخته شد.` ,`${generated.length} learning sessions created.`))}
function clearLearningPlan(){state.tasks=state.tasks.filter(task=>!task.generatedLearning);state.learningPlan=null;save();render();toast(L('برنامهٔ خودکار پاک شد.','Automatic plan cleared.'))}
function learningWindowSessions(){const plan=state.learningPlan;if(!plan)return[];const all=plan.sessions;const start=asDate(plan.draft.startDate);let end=new Date(start);if(state.learningPlanView==='week')end.setDate(end.getDate()+6);else if(state.learningPlanView==='month')end.setMonth(end.getMonth()+1);else if(state.learningPlanView==='quarter')end.setMonth(end.getMonth()+3);else return all;const until=isoFromDate(end);return all.filter(x=>x.date>=plan.draft.startDate&&x.date<until)}
function setLearningPlanView(view){state.learningPlanView=view;render();save()}
function planModes(){return `<div class="horizon-tabs">${[['day','☼'],['week','▦'],['month','◫'],['quarter','◈'],['year','◎']].map(([mode,icon])=>`<button class="horizon-tab ${state.plannerMode===mode?'active':''}" onclick="setPlannerMode('${mode}')"><i>${icon}</i>${mode==='day'?L('روزانه','Daily'):t(mode)}</button>`).join('')}</div>`}

function weekBoard(){const dates=planningWeek();return `<div class="week-board">${dates.map(iso=>{const tasks=rangeTasks(iso,iso);const today=iso===todayISO();return `<section class="week-day ${today?'today':''}"><header><span>${localizedDate(iso,{weekday:'short'})}</span><b>${localizedDate(iso,{day:'numeric'})}</b></header><div class="week-day-tasks">${tasks.length?tasks.map(taskMini).join(''):`<p>${state.lang==='fa'?'فضای آزاد':'Open space'}</p>`}</div><button class="plan-add" onclick="openPlanDate('${iso}')">＋</button></section>`}).join('')}</div>`}

function dayBoard(){const date=state.planDate||todayISO(),tasks=rangeTasks(date,date).sort((a,b)=>a.time.localeCompare(b.time)),done=tasks.filter(x=>x.done).length,missed=tasks.filter(x=>x.skipped).length;return `<div class="daily-board"><div class="daily-board-head"><div><span>${L('امروز','Today')}</span><h3>${localizedDate(date,{weekday:'long',day:'numeric',month:'long'})}</h3></div><div class="daily-board-summary"><i>✓ ${uiNumber(done)} ${L('انجام','done')}</i><i>× ${uiNumber(missed)} ${L('انجام‌نشده','missed')}</i></div></div><div class="daily-timeline">${tasks.length?tasks.map(task=>`<article class="daily-task ${taskState(task)}" draggable="true" ondragstart="beginTaskDrag(event,${task.id})"><time><bdi>${task.time}</bdi><small>${uiNumber(task.duration)} ${L('دقیقه','min')}</small></time><div class="daily-task-main"><span class="subject-tag ${task.learning?.kind||''}">${task.learning?esc(task.learning.subject):categoryLabel(task.category)}</span><h3>${esc(localized(task))}</h3>${task.learning?`<p>${esc(task.learning.strategy)}</p>`:''}</div>${taskStatusButtons(task,false)}</article>`).join(''):`<div class="empty">${L('برای امروز کاری ثبت نشده است. از «کار جدید» یا «یادگیری» شروع کن.','Nothing is planned today. Start with New task or Learning.')}</div>`}</div></div>`}
function monthBoard(){const cursor=activeCalendarCursor(),first=asDate(cursorStartIso(cursor)),offset=state.lang==='fa'?((first.getDay()+1)%7):first.getDay(),days=cursorMonthDays(cursor),headers=calendarWeekHeaders(),cells=[];for(let i=0;i<offset;i++)cells.push('<div class="calendar-blank"></div>');for(let day=1;day<=days;day++){const iso=cursorDayIso(cursor,day),tasks=state.tasks.filter(task=>taskISO(task)===iso),done=tasks.filter(task=>task.done).length,missed=tasks.filter(task=>task.skipped).length;cells.push(`<button class="calendar-day-cell ${iso===todayISO()?'today':''} ${iso===state.planDate?'selected':''}" onclick="selectCalendarDay('${iso}')" ondragover="event.preventDefault();this.classList.add('drag-over')" ondragleave="this.classList.remove('drag-over')" ondrop="this.classList.remove('drag-over');dropTaskOnDate(event,'${iso}')"><b>${uiNumber(day)}</b><span>${tasks.length?`${uiNumber(done)}/${uiNumber(tasks.length)}`:''}</span><i class="calendar-status-dots">${tasks.slice(0,4).map(task=>`<em class="${taskState(task)}"></em>`).join('')}</i>${missed?`<small>×${uiNumber(missed)}</small>`:''}</button>`)}return `<div class="calendar-board"><header class="calendar-board-head"><div><span>${state.lang==='fa'?L('تقویم شمسی','Solar Hijri calendar'):L('تقویم میلادی','Gregorian calendar')}</span><h3>${calendarMonthName(cursor)}</h3></div><div class="calendar-controls"><button onclick="shiftPlanCalendar(-1)" aria-label="previous">‹</button><button class="calendar-today" onclick="jumpToTodayCalendar()">${L('امروز','Today')}</button><button onclick="shiftPlanCalendar(1)" aria-label="next">›</button></div></header><div class="calendar-grid">${headers.map(h=>`<span class="calendar-weekday">${h}</span>`).join('')}${cells.join('')}</div><p class="calendar-note">${L('روی هر روز بزن تا برنامهٔ روزانهٔ همان تاریخ باز شود.','Select a day to open its daily plan.')}</p></div>`}
function quarterBoard(){const months=calendarMonthSequence(3).map(cursor=>{const tasks=calendarMonthTaskList(cursor),done=tasks.filter(task=>task.done).length;return `<article class="month-card"><span>${calendarMonthName(cursor)}</span><b>${uiNumber(tasks.length)}</b><small>${t('tasks')}</small><div class="progress-line"><i style="width:${tasks.length?Math.round(done/tasks.length*100):0}%"></i></div><em>${tasks.length?`${uiRatio(done,tasks.length)} ${t('completed').toLowerCase()}`:t('noPlan')}</em></article>`});return `<div class="multi-board"><div class="board-month-label">${t('nextThreeMonths')}</div><div class="quarter-grid">${months.join('')}</div></div>`}
function yearBoard(){const months=calendarMonthSequence(12).map(cursor=>{const tasks=calendarMonthTaskList(cursor),done=tasks.filter(task=>task.done).length;return `<article class="year-month"><span>${new Intl.DateTimeFormat(cursor.lang==='fa'?'fa-IR-u-ca-persian':'en-US',{month:'short'}).format(asDate(cursorStartIso(cursor)))}</span><b>${uiNumber(tasks.length)}</b><i class="${tasks.length&&done===tasks.length?'complete':''}"></i></article>`});return `<div class="year-board"><div class="board-month-label">${t('thisYear')}</div><div class="year-grid">${months.join('')}</div></div>`}
function plannerBoard(){return state.plannerMode==='day'?dayBoard():state.plannerMode==='week'?weekBoard():state.plannerMode==='month'?monthBoard():state.plannerMode==='quarter'?quarterBoard():yearBoard()}
function tasksForPlanner(){if(state.plannerMode==='day')return rangeTasks(todayISO(),todayISO());if(state.plannerMode==='week'){const d=planningWeek();return rangeTasks(d[0],d[6])}if(state.plannerMode==='month')return calendarMonthTaskList(activeCalendarCursor());if(state.plannerMode==='quarter'){const cursors=calendarMonthSequence(3),first=cursorStartIso(cursors[0]),last=cursorDayIso(cursors[2],cursorMonthDays(cursors[2]));return rangeTasks(first,last)}if(state.plannerMode==='year'){const cursors=calendarMonthSequence(12),first=cursorStartIso(cursors[0]),last=cursorDayIso(cursors[11],cursorMonthDays(cursors[11]));return rangeTasks(first,last)}return state.tasks}


function learningToolProfiles(plan){return plan?.profiles||[]}
function adaptiveLearningStats(){const plan=state.learningPlan;if(!plan)return{overdue:[],completion:0,peak:'—'};const start=isoFromToday(-6),end=todayISO(),recent=state.tasks.filter(task=>task.generatedLearning&&taskISO(task)>=start&&taskISO(task)<=end),done=recent.filter(task=>task.done),overdue=state.tasks.filter(task=>task.generatedLearning&&!task.done&&(task.skipped||taskISO(task)<todayISO())),hourMap={};done.forEach(task=>{const hour=Number(String(task.time||'00').split(':')[0]);hourMap[hour]=(hourMap[hour]||0)+1});const peak=Object.keys(hourMap).length?`${String(Number(Object.entries(hourMap).sort((a,b)=>b[1]-a[1])[0][0])).padStart(2,'0')}:00`: '—';return{overdue,completion:recent.length?Math.round(done.length/recent.length*100):0,peak}}
function adaptLearningPlan(){const plan=state.learningPlan;if(!plan){toast(L('ابتدا یک برنامهٔ یادگیری بساز.','Build a learning plan first.'));return}const stats=adaptiveLearningStats();if(!stats.overdue.length){toast(L('کار عقب‌افتاده‌ای برای بازچینی وجود ندارد.','There are no overdue learning tasks to rebalance.'));return}const draft=plan.draft,dates=activeLearningDates(todayISO(),Math.max(1,draft.months),draft.days).filter(date=>date>=todayISO()),capacity=Math.max(30,draft.dailyMinutes),load={};state.tasks.filter(task=>task.generatedLearning&&taskISO(task)>=todayISO()).forEach(task=>load[task.date]=(load[task.date]||0)+Number(task.duration||0));let moved=0;for(const task of stats.overdue){const target=dates.find(date=>(load[date]||0)+Number(task.duration||0)<=capacity);if(!target)break;load[target]=(load[target]||0)+Number(task.duration||0);task.date=target;task.time=studySlotTime(Math.max(0,Math.floor((load[target]-task.duration)/Math.max(1,task.duration))),capacity,studyBlockCount(capacity));task.done=false;task.skipped=false;task.adapted=true;moved++}plan.adaptations=[...(plan.adaptations||[]),{date:todayISO(),moved,completion:stats.completion}];save();render();toast(L(`${uiNumber(moved)} جلسه با ظرفیت روزهای آینده بازچینی شد.`,`${moved} sessions were rebalanced across future capacity.`))}
function masteryKey(subject,skill){return `${subject}::${skill}`}
function currentAssessment(plan){const profiles=learningToolProfiles(plan),subject=state.assessmentSubject||profiles[0]?.name;if(!subject)return null;const profile=profiles.find(item=>item.name===subject)||profiles[0],index=state.flashcardIndex%profile.skills.length,skill=profile.skills[index],key=masteryKey(profile.name,skill),record=state.mastery[key]||{level:0,attempts:0};return{profile,skill,key,record}}
function startMicroAssessment(subject){state.assessmentSubject=subject;state.flashcardIndex=(state.flashcardIndex+1)%1000;render()}
function scheduleMasteryReview(profile,skill,days){const date=isoFromToday(days),exists=state.tasks.some(task=>task.masteryReview&&task.learning?.subject===profile.name&&task.learning?.skill===skill&&task.date===date);if(exists)return;state.tasks.push(normalizeTask({id:Date.now()+Math.floor(Math.random()*1000),title:`${profile.name} · مرور ${skill}`,titleEn:`${profile.name} · Review ${skill}`,category:'Study',date,time:'18:00',duration:20,priority:'Medium',done:false,skipped:false,masteryReview:true,learning:{subject:profile.name,skill,strategy:'بازیابی فعال پس از ارزیابی',type:'review'}}))}
function recordMastery(level){const assessment=currentAssessment(state.learningPlan);if(!assessment)return;const score=Number(level),previous=state.mastery[assessment.key]||{attempts:0};state.mastery[assessment.key]={level:score,attempts:previous.attempts+1,lastDate:todayISO()};if(score<2)scheduleMasteryReview(assessment.profile,assessment.skill,score===0?1:3);state.flashcardIndex++;save();render();toast(score===2?L('عالی؛ کارت بعدی آماده است.','Great — next card is ready.'):L('یک مرور هدفمند به برنامه اضافه شد.','A targeted review was added to your plan.'))}
function addErrorLog(subject){const input=document.getElementById('errorLogInput'),note=String(input?.value||'').trim();if(!note){toast(L('اول خطا یا نکته را بنویس.','Write an error or note first.'));return}state.errorLogs.unshift({id:Date.now(),subject,note,date:todayISO()});state.errorLogs=state.errorLogs.slice(0,30);save();render();toast(L('نکتهٔ خطا ثبت شد.','Error note saved.'))}
function learningEnhancementsMarkup(plan){if(!plan)return'';const stats=adaptiveLearningStats(),assessment=currentAssessment(plan),subjects=learningToolProfiles(plan),errors=state.errorLogs.slice(0,3);return `<section class="learning-tools"><div class="adaptive-card"><div><span class="learn-kicker">${L('برنامهٔ تطبیقی','ADAPTIVE PLANNER')}</span><h2>${stats.overdue.length?L(`${uiNumber(stats.overdue.length)} جلسه نیاز به بازچینی دارد`,` ${stats.overdue.length} sessions need rebalancing`):L('برنامه در تعادل است','Your plan is balanced')}</h2><p>${L(`نرخ تکمیل ۷ روز اخیر: ${uiPercent(stats.completion)} · ساعت پربازده ثبت‌شده: ${stats.peak}` ,`Recent completion: ${stats.completion}% · observed peak hour: ${stats.peak}`)}</p></div><button class="primary" onclick="adaptLearningPlan()">↻ ${L('بازچینی هوشمند','Rebalance')}</button></div><div class="learning-tools-grid"><section class="mastery-card"><span class="learn-kicker">${L('ارزیابی کوتاه','MICRO ASSESSMENT')}</span><div class="assessment-subjects">${subjects.map(profile=>`<button class="${(state.assessmentSubject||subjects[0]?.name)===profile.name?'active':''}" onclick="startMicroAssessment('${esc(profile.name).replace(/'/g,'&#39;')}')">${esc(profile.name)}</button>`).join('')}</div>${assessment?`<div class="flashcard"><span>${L('بدون نگاه‌کردن به منبع','WITHOUT LOOKING')}</span><h3>${L(`مفهوم «${assessment.skill}» را با زبان خودت توضیح بده.`, `Explain “${assessment.skill}” in your own words.`)}</h3><p>${L('بعد از پاسخ‌دادن، میزان تسلطت را صادقانه ثبت کن.','After answering, record your mastery honestly.')}</p><div class="mastery-actions"><button onclick="recordMastery(0)">${L('نیاز به مرور','Need review')}</button><button onclick="recordMastery(1)">${L('تا حدی بلدم','Almost')}</button><button onclick="recordMastery(2)">${L('کاملاً بلدم','I know it')}</button></div><small>${L(`تلاش‌های ثبت‌شده: ${uiNumber(assessment.record.attempts||0)}`,`Logged attempts: ${assessment.record.attempts||0}`)}</small></div>`:''}</section function normalizeTask(task={}){

  const subtasks=Array.isArray(task.subtasks)?task.subtasks.map(item=>typeof item==='string'?{text:item,done:false}:{text:item.text||'',done:!!item.done}).filter(item=>item.text):[];
  const category=['Study','Work','Personal'].includes(task.category)?task.category:'Study';
  const priority=['High','Medium','Low'].includes(task.priority)?task.priority:'Medium';
  const recurrence=['none','daily','weekdays','weekly','custom'].includes(task.recurrence)?task.recurrence:'none';

function nextRecurrenceDate(task){
  const date=asDate(task.date||todayISO());

function createRecurringFollowUp(task){

function saveTask(event){
  event.preventDefault();captureTaskDraft();const draft=normalizeTask(state.taskDraft||{}),title=String(draft.title||'').trim();if(!title)return;

function icsEscape(value){return String(value||'').replace(/\\/g,'\\\\').replace(/\n/g,'\\n').replace(/,/g,'\\,').replace(/;/g,'\\;')}
function icsDate(date,time='00:00'){const [y,m,d]=String(date).split('-'),[hh,mm]=String(time).split(':');return `${y}${m}${d}T${hh||'00'}${mm||'00'}00`}
function calendarEvent(task){const start=asDate(task.date||todayISO());const [hours,minutes]=String(task.time||'00:00').split(':').map(Number);start.setHours(hours||0,minutes||0,0,0);const end=new Date(start.getTime()+Math.max(5,Number(task.duration)||30)*60000);return {start,end,startIcs:icsDate(task.date||todayISO(),task.time),endIcs:`${end.getFullYear()}${String(end.getMonth()+1).padStart(2,'0')}${String(end.getDate()).padStart(2,'0')}T${String(end.getHours()).padStart(2,'0')}${String(end.getMinutes()).padStart(2,'0')}00`}}
function downloadText(filename,text,type){const blob=new Blob([text],{type}),url=URL.createObjectURL(blob),link=document.createElement('a');link.href=url;link.download=filename;document.body.appendChild(link);link.click();link.remove();URL.revokeObjectURL(url)}
function exportCalendar(){const records=state.tasks.filter(task=>!task.done).sort((a,b)=>taskISO(a).localeCompare(taskISO(b))||task.time.localeCompare(b.time)).map(task=>{const event=calendarEvent(task);return `BEGIN:VEVENT\r\nUID:orbitplan-${task.id}@local\r\nDTSTAMP:${icsDate(todayISO(),'00:00')}\r\nDTSTART:${event.startIcs}\r\nDTEND:${event.endIcs}\r\nSUMMARY:${icsEscape(task.title)}\r\nDESCRIPTION:${icsEscape(task.notes||'')}\r\nEND:VEVENT`});downloadText(`orbitplan-calendar-${todayISO()}.ics`,`BEGIN:VCALENDAR\r\nVERSION:2.0\r\nPRODID:-//OrbitPlan//EN\r\nCALSCALE:GREGORIAN\r\n${records.join('\r\n')}\r\nEND:VCALENDAR\r\n`,'text/calendar;charset=utf-8');toast(L('فایل تقویم آماده شد.','Calendar file exported.'))}
function unfoldIcs(input){return String(input||'').replace(/\r?\n[ \t]/g,'')}
function importCalendar(event){const file=event.target.files?.[0];if(!file)return;const reader=new FileReader();reader.onload=()=>{try{const blocks=unfoldIcs(reader.result).split(/BEGIN:VEVENT\r?\n?/).slice(1),added=[];for(const block of blocks){const pick=name=>{const match=block.match(new RegExp(`^${name}(?:;[^:]*)?:(.+)$`,'m'));return match?match[1].trim():''};const summary=pick('SUMMARY').replace(/\\n/g,'\n').replace(/\\,/g,',').replace(/\\;/g,';'),dt=pick('DTSTART'),end=pick('DTEND');if(!summary||!/^\d{8}/.test(dt))continue;const date=`${dt.slice(0,4)}-${dt.slice(4,6)}-${dt.slice(6,8)}`,time=dt.length>=13?`${dt.slice(9,11)}:${dt.slice(11,13)}`:'09:00';let duration=45;if(/^\d{8}T\d{6}/.test(end)){const a=new Date(`${date}T${time}:00`),b=new Date(`${end.slice(0,4)}-${end.slice(4,6)}-${end.slice(6,8)}T${end.slice(9,11)}:${end.slice(11,13)}:00`);duration=Math.max(5,Math.round((b-a)/60000)||45)}added.push(normalizeTask({id:Date.now()+Math.floor(Math.random()*100000)+added.length,title:summary,titleEn:summary,category:'Personal',date,time,duration,notes:pick('DESCRIPTION').replace(/\\n/g,'\n'),tags:[L('تقویم','calendar')]}))}if(!added.length)throw new Error('no-events');state.tasks.push(...added);save();render();toast(L(`${uiNumber(added.length)} رویداد از تقویم وارد شد.`,`${added.length} calendar events imported.`))}catch(error){toast(L('فایل تقویم قابل‌خواندن نیست.','Calendar file could not be read.'))}};reader.readAsText(file)}
function openCalendarProvider(provider){const task=nextTask()||state.tasks.find(item=>!item.done)||normalizeTask({title:'OrbitPlan',date:todayISO(),time:'09:00',duration:30});const event=calendarEvent(task),title=localized(task),notes=task.notes||'';const url=provider==='google'?`https://calendar.google.com/calendar/render?action=TEMPLATE&text=${encodeURIComponent(title)}&dates=${event.startIcs}/${event.endIcs}&details=${encodeURIComponent(notes)}`:`https://outlook.office.com/calendar/0/deeplink/compose?subject=${encodeURIComponent(title)}&startdt=${encodeURIComponent(event.start.toISOString())}&enddt=${encodeURIComponent(event.end.toISOString())}&body=${encodeURIComponent(notes)}`;window.open(url,'_blank','noopener,noreferrer')}

function textToBytes(value){return new TextEncoder().encode(value)}
function bytesToBase64(bytes){let binary='';new Uint8Array(bytes).forEach(byte=>binary+=String.fromCharCode(byte));return btoa(binary)}
function base64ToBytes(value){const binary=atob(value),bytes=new Uint8Array(binary.length);for(let i=0;i<binary.length;i++)bytes[i]=binary.charCodeAt(i);return bytes}
async function deriveBackupKey(password,salt){const material=await crypto.subtle.importKey('raw',textToBytes(password),'PBKDF2',false,['deriveKey']);return crypto.subtle.deriveKey({name:'PBKDF2',salt,iterations:250000,hash:'SHA-256'},material,{name:'AES-GCM',length:256},false,['encrypt','decrypt'])}
function backupPayload(){return {version:2,exportedAt:new Date().toISOString(),state:cloudSafeState()}}
function exportBackup(){downloadText(`orbitplan-backup-${todayISO()}.json`,JSON.stringify(backupPayload(),null,2),'application/json');toast(L('پشتیبان دانلود شد.','Backup downloaded.'))}
async function exportEncryptedBackup(){const password=document.getElementById('backupPassphrase')?.value||'';if(password.length<10){toast(L('برای پشتیبان رمزدار، گذرواژه‌ای با حداقل ۱۰ نویسه وارد کن.','Use a passphrase with at least 10 characters.'));return}if(!window.crypto?.subtle){toast(L('رمزنگاری در این مرورگر در دسترس نیست.','Encryption is unavailable in this browser.'));return}const salt=crypto.getRandomValues(new Uint8Array(16)),iv=crypto.getRandomValues(new Uint8Array(12)),key=await deriveBackupKey(password,salt),cipher=await crypto.subtle.encrypt({name:'AES-GCM',iv},key,textToBytes(JSON.stringify(backupPayload())));downloadText(`orbitplan-encrypted-backup-${todayISO()}.json`,JSON.stringify({version:2,encrypted:true,kdf:'PBKDF2-SHA-256',iterations:250000,salt:bytesToBase64(salt),iv:bytesToBase64(iv),cipher:bytesToBase64(cipher)},null,2),'application/json');toast(L('پشتیبان رمزدار دانلود شد؛ گذرواژه بازیابی‌پذیر نیست.','Encrypted backup downloaded; the passphrase cannot be recovered.'))}
async function restorePayload(payload){if(payload?.encrypted){const password=document.getElementById('backupPassphrase')?.value||'';if(!password)throw new Error('password');const key=await deriveBackupKey(password,base64ToBytes(payload.salt));const plain=await crypto.subtle.decrypt({name:'AES-GCM',iv:base64ToBytes(payload.iv)},key,base64ToBytes(payload.cipher));payload=JSON.parse(new TextDecoder().decode(plain))}const restored=payload?.state||payload;applyRestoredState(restored,{preserveAccount:true});save();render();toast(L('پشتیبان با موفقیت بازیابی شد.','Backup restored successfully.'))}
function importBackup(event){const file=event.target.files?.[0];if(!file)return;const reader=new FileReader();reader.onload=async()=>{try{await restorePayload(JSON.parse(reader.result))}catch(error){toast(error.message==='password'?L('برای بازیابی، گذرواژهٔ پشتیبان رمزدار را وارد کن.','Enter the encrypted backup passphrase first.'):L('فایل پشتیبان یا گذرواژه معتبر نیست.','The backup file or passphrase is not valid.'))}};reader.readAsText(file)}

function dueFlashcards(){return state.flashcards.filter(card=>card.dueDate<=todayISO()).sort((a,b)=>a.dueDate.localeCompare(b.dueDate))}
function flashcardLabMarkup(){const due=dueFlashcards(),active=state.flashcards.find(card=>String(card.id)===String(state.flashcardSession?.id));return `<section class="flashcard-lab"><div class="flashcard-lab-head"><div><span class="learn-kicker">${L('فلش‌کارت و مرور','FLASHCARDS & REVIEW')}</span><h2>${due.length?L(`${uiNumber(due.length)} کارت برای مرور آماده است.`,`${due.length} cards are due for review.`):L('دک مرور امروز سبک است.','Your review deck is light today.')}</h2><p>${L('کارت‌های خودت را بساز، پاسخ را آشکار کن و کیفیت یادآوری را ثبت کن.','Create your own cards, reveal the answer, and record recall quality.')}</p></div><button class="primary" onclick="startFlashcardReview()">↻ ${L('شروع مرور','Review now')}</button></div>${active?`<div class="flashcard-review"><span>${esc(active.subject)} · ${L('کارت','card')} ${uiNumber(state.flashcards.indexOf(active)+1)}</span><h3>${esc(active.front)}</h3>${state.flashcardSession.revealed?`<div class="flashcard-answer">${esc(active.back).replace(/\n/g,'<br>')}</div><div class="flashcard-grades"><button onclick="gradeFlashcard('again')">${L('دوباره','Again')}<small>1d</small></button><button onclick="gradeFlashcard('hard')">${L('سخت','Hard')}<small>2d</small></button><button onclick="gradeFlashcard('good')">${L('خوب','Good')}<small>+2×</small></button><button onclick="gradeFlashcard('easy')">${L('آسان','Easy')}<small>+3×</small></button></div>`:`<button class="quiet reveal-card" onclick="revealFlashcard()">${L('نمایش پاسخ','Reveal answer')}</button>`}<button class="text-action" onclick="endFlashcardReview()">${L('پایان مرور','End review')}</button></div>`:`<div class="flashcard-create"><form onsubmit="addFlashcard(event)"><label>${L('موضوع','Subject')}<input id="cardSubject" maxlength="80" placeholder="${L('مثلاً: احتمال','e.g. probability')}"></label><label>${L('پرسش / روی کارت','Question / front')}<textarea id="cardFront" required maxlength="1200" placeholder="${L('مثلاً: تفاوت احتمال شرطی و مستقل چیست؟','e.g. What is conditional probability?')}"></textarea></label><label>${L('پاسخ / پشت کارت','Answer / back')}<textarea id="cardBack" required maxlength="1200" placeholder="${L('پاسخ کوتاه و دقیق…','A concise answer…')}"></textarea></label><button class="quiet" type="submit">＋ ${L('افزودن فلش‌کارت','Add flashcard')}</button></form><div class="deck-list">${state.flashcards.length?state.flashcards.slice().sort((a,b)=>a.dueDate.localeCompare(b.dueDate)).slice(0,6).map(card=>`<article><span>${esc(card.subject)}</span><b>${esc(card.front)}</b><small>${L('مرور بعدی: ','Next review: ')}${localizedDate(card.dueDate,{day:'numeric',month:'short'})} · ${uiNumber(card.repetitions)} ${L('مرور','reviews')}</small><button class="text-action danger" onclick="deleteFlashcard(${card.id})" aria-label="${L('حذف فلش‌کارت','Delete flashcard')}">×</button></article>`).join(''):`<p>${L('هنوز کارتی نداری. از یک مفهوم دشوار شروع کن.','No cards yet. Start with one difficult concept.')}</p>`}</div></div>`}</section>`}
function addFlashcard(event){event.preventDefault();const front=String(document.getElementById('cardFront')?.value||'').trim(),back=String(document.getElementById('cardBack')?.value||'').trim(),subject=String(document.getElementById('cardSubject')?.value||L('عمومی','General')).trim();if(!front||!back)return;state.flashcards.unshift(normalizeFlashcard({id:Date.now(),subject,front,back,dueDate:todayISO()}));save();render();toast(L('فلش‌کارت به دک اضافه شد.','Flashcard added to the deck.'))}
function startFlashcardReview(){const card=dueFlashcards()[0]||state.flashcards.sort((a,b)=>a.dueDate.localeCompare(b.dueDate))[0];if(!card){toast(L('ابتدا یک فلش‌کارت بساز.','Create a flashcard first.'));return}state.flashcardSession={id:card.id,revealed:false};render()}
function revealFlashcard(){state.flashcardSession={...state.flashcardSession,revealed:true};render()}
function endFlashcardReview(){state.flashcardSession={id:null,revealed:false};render()}
function gradeFlashcard(grade){const id=state.flashcardSession?.id,card=state.flashcards.find(item=>String(item.id)===String(id));if(!card)return;let interval=card.interval,repetitions=card.repetitions,lapses=card.lapses;if(grade==='again'){interval=1;repetitions=0;lapses++}else if(grade==='hard'){interval=Math.max(2,Math.round(interval*1.2));repetitions++}else if(grade==='good'){interval=Math.max(3,Math.round(interval*2));repetitions++}else{interval=Math.max(4,Math.round(interval*3));repetitions++}Object.assign(card,{interval,repetitions,lapses,lastReviewed:todayISO(),dueDate:isoFromToday(interval)});const next=dueFlashcards()[0];state.flashcardSession=next?{id:next.id,revealed:false}:{id:null,revealed:false};save();render();toast(L('زمان مرور بعدی ثبت شد.','Next review date scheduled.'))}
function deleteFlashcard(id){if(!window.confirm(L('این فلش‌کارت حذف شود؟','Delete this flashcard?')))return;state.flashcards=state.flashcards.filter(card=>String(card.id)!==String(id));if(String(state.flashcardSession?.id)===String(id))state.flashcardSession={id:null,revealed:false};save();render()}

function advancedInsightData(){const days=state.insightRange==='week'?7:state.insightRange==='quarter'?90:30,start=isoFromToday(-(days-1)),today=todayISO(),period=state.tasks.filter(task=>taskISO(task)>=start&&taskISO(task)<=today),completed=period.filter(task=>task.done),scheduled=period.reduce((sum,task)=>sum+Number(task.duration||0),0),taskCompletedMinutes=completed.reduce((sum,task)=>sum+Number(task.duration||0),0),focusLogs=(state.focusSessions||[]).filter(session=>{const date=focusSessionDate(session.endedAt);return date>=start&&date<=today}),focusMinutesActual=focusLogs.reduce((sum,session)=>sum+Number(session.minutes||0),0),actualSource=focusMinutesActual?'focus':'task',actual=focusMinutesActual||taskCompletedMinutes,rate=period.length?Math.round(completed.length/period.length*100):0,weekly=[];for(let i=3;i>=0;i--){const end=isoFromToday(-i*7),begin=isoFromToday(-(i*7+6)),items=state.tasks.filter(task=>taskISO(task)>=begin&&taskISO(task)<=end);weekly.push({label:localizedDate(end,{day:'numeric',month:'short'}),rate:items.length?Math.round(items.filter(task=>task.done).length/items.length*100):0})}const masteryValues=Object.values(state.mastery||{}),mastery=masteryValues.length?Math.round(masteryValues.reduce((sum,item)=>sum+Number(item.level||0),0)/(masteryValues.length*2)*100):0;const future=state.tasks.filter(task=>taskISO(task)>today&&taskISO(task)<=isoFromToday(days)&&!task.done),forecastMinutes=Math.round(future.reduce((sum,task)=>sum+Number(task.duration||0),0)*rate/100),max=Math.max(1,...weekly.map(item=>item.rate));return{days,start,period,completed,scheduled,actual,rate,weekly,mastery,future,forecastMinutes,max,focusLogs,actualSource}}
function setInsightRange(range){state.insightRange=range;save();render()}
function advancedInsightsMarkup(){const data=advancedInsightData();return `<section class="advanced-insights"><div class="advanced-head"><div><span class="intel-eyebrow">${L('تحلیل روند','PERFORMANCE ANALYTICS')}</span><h2>${L('برنامه در برابر اجرای واقعی','Plan vs. actual execution')}</h2></div><div class="range-tabs">${[['week','۷ روز','7 days'],['month','۳۰ روز','30 days'],['quarter','۹۰ روز','90 days']].map(([key,fa,en])=>`<button class="${state.insightRange===key?'active':''}" onclick="setInsightRange('${key}')">${L(fa,en)}</button>`).join('')}</div></div><div class="advanced-metrics"><article><span>${L('نرخ اجرای دوره','Period completion')}</span><b>${uiPercent(data.rate)}</b><small>${uiNumber(data.completed.length)} / ${uiNumber(data.period.length)} ${L('کار ثبت‌شده','tasks recorded')}</small></article><article><span>${L('برنامه‌ریزی‌شده','Planned')}</span><b>${focusDuration(data.scheduled)}</b><small>${L('زمان taskهای این دوره','task time in this period')}</small></article><article><span>${L('زمان واقعی تمرکز','Actual focus')}</span><b>${focusDuration(data.actual)}</b><small>${data.actualSource==='focus'?L(`${uiNumber(data.focusLogs.length)} جلسهٔ تمرکز ثبت‌شده`,`${data.focusLogs.length} focus sessions logged`):L('برآورد از taskهای کامل‌شده','estimated from completed tasks')}</small></article><article><span>${L('تسلط ثبت‌شده','Logged mastery')}</span><b>${uiPercent(data.mastery)}</b><small>${L('براساس ارزیابی‌های کوتاه','from micro assessments')}</small></article></div><div class="trend-forecast"><section><div class="intel-panel-head"><div><span class="intel-eyebrow">${L('چهار هفتهٔ اخیر','FOUR-WEEK TREND')}</span><h3>${L('ریتم اجرای task','Task completion rhythm')}</h3></div></div><div class="trend-bars">${data.weekly.map(item=>`<article><div><i style="height:${Math.max(5,item.rate)}%"></i></div><b>${uiPercent(item.rate)}</b><span>${item.label}</span></article>`).join('')}</div></section><aside class="forecast-card"><span>✦ ${L('پیش‌بینی محافظه‌کارانه','CONSERVATIVE FORECAST')}</span><h3>${data.rate>=70?L('در مسیر برنامه هستی.','You are on track.'):L('نیاز به سبک‌سازی برنامه داری.','Your plan needs relief.')}</h3><p>${L(`با نرخ اجرای فعلی، حدود ${focusDuration(data.forecastMinutes)} از ${focusDuration(data.future.reduce((sum,task)=>sum+Number(task.duration||0),0))} زمان آینده احتمالاً انجام می‌شود.`,`At the current completion rate, roughly ${focusDuration(data.forecastMinutes)} of ${focusDuration(data.future.reduce((sum,task)=>sum+Number(task.duration||0),0))} future time is likely to be completed.`)}</p><button class="quiet" onclick="go('plan')">${L('بازبینی برنامه','Review plan')}</button></aside></div></section>`}

function pwaReminderStatus(){if(state.pwaStatus==='ready')return L('PWA آماده است؛ تا وقتی اپ در حال اجراست، اعلان‌ها با سرویس‌ورکر نمایش داده می‌شوند.','PWA is ready; while the app remains running, notifications are shown through the service worker.');return L('برای اعلان‌های بهتر، اپ را از مرورگر نصب کن. یادآوریِ دقیق هنگام بسته‌بودن کاملِ وب‌اپ به Push server یا نسخهٔ native نیاز دارد.','Install the app for better notifications. Exact alerts while a web app is fully closed need a push server or native app.')}
function requestReminderPermission(){if(!('Notification' in window)){toast(L('مرورگر از اعلان پشتیبانی نمی‌کند.','Notifications are not supported here.'));return}Notification.requestPermission().then(permission=>{state.reminderEnabled=permission==='granted';save();scheduleTaskReminders();render();toast(permission==='granted'?L('یادآوری‌ها فعال شد.','Reminders enabled.'):L('اجازهٔ اعلان داده نشد.','Notification permission was not granted.'))})}
function showOrbitPlanReminder(task){const body=`${task.title} · ${task.time}`;if(orbitPlanSWRegistration?.active){orbitPlanSWRegistration.active.postMessage({type:'ORBITPLAN_SHOW_REMINDER',body,tag:`orbitplan-${task.id}-${task.date}`});return}new Notification('OrbitPlan',{body})}
function scheduleTaskReminders(){reminderTimers.forEach(timer=>clearTimeout(timer));reminderTimers=[];if(!state.reminderEnabled||!('Notification' in window)||Notification.permission!=='granted')return;const now=Date.now();state.tasks.filter(task=>!task.done&&!task.skipped&&task.reminderMinutes>0&&task.date===todayISO()).forEach(task=>{const [hours,minutes]=String(task.time||'00:00').split(':').map(Number);const target=new Date();target.setHours(hours,minutes-task.reminderMinutes,0,0);const delay=target.getTime()-now;if(delay>0&&delay<86400000)reminderTimers.push(setTimeout(()=>showOrbitPlanReminder(task),delay))})}

/* OrbitPlan Growth Upgrade — auto-sync queue and actual focus-time logs. */
let orbitAutoSyncTimer=null, orbitSyncInFlight=false;
function ensureGrowthState(){
  state.syncMeta=state.syncMeta&&typeof state.syncMeta==='object'?state.syncMeta:{pending:false,status:'local',lastError:'',lastLocalChange:'',lastAutoSync:''};
  state.focusSessions=Array.isArray(state.focusSessions)?state.focusSessions.filter(item=>item&&Number(item.minutes)>0).slice(0,1000):[];
  state.timer={...baseState().timer,...state.timer,active:false};
}
function persistOrbitLocal(){try{const safe={...state,timer:{...state.timer,active:false}};localStorage.setItem('orbitplan-v2',JSON.stringify(safe))}catch(error){}}
function queueAutomaticSync(){
  if(orbitSyncInFlight||!state.account?.token)return;
  const offline=typeof navigator!=='undefined'&&navigator.onLine===false;
  state.syncMeta={...state.syncMeta,pending:true,status:offline?'offline':'queued',lastLocalChange:new Date().toISOString(),lastError:''};
  persistOrbitLocal();if(offline)return;clearTimeout(orbitAutoSyncTimer);orbitAutoSyncTimer=setTimeout(()=>syncCloud('upload',false,true),1800);if(orbitAutoSyncTimer?.unref)orbitAutoSyncTimer.unref();
}
function save(){persistOrbitLocal();queueAutomaticSync()}
async function syncCloud(direction='upload',force=false,silent=false){
  if(!state.account?.token){if(!silent)toast(L('ابتدا حساب بساز یا وارد شو.','Create an account or sign in first.'));return}
  if(orbitSyncInFlight)return;orbitSyncInFlight=true;state.syncMeta={...state.syncMeta,status:'syncing',lastError:''};persistOrbitLocal();
  try{
    if(direction==='download'){
      const remote=await cloudRequest('/api/sync');if(!remote.state){if(!silent)toast(L('هنوز نسخه‌ای در ابر وجود ندارد.','No cloud version exists yet.'));return}
      if(!silent&&!window.confirm(L('نسخهٔ محلی با نسخهٔ ابری جایگزین شود؟','Replace local data with the cloud version?')))return;
      applyRestoredState(remote.state);state.account.lastSyncedAt=remote.updatedAt;state.syncMeta={...state.syncMeta,pending:false,status:'synced',lastAutoSync:new Date().toISOString(),lastError:''};persistOrbitLocal();render();if(!silent)toast(L('نسخهٔ ابری بازیابی شد.','Cloud version restored.'));return;
    }
    const response=await cloudRequest('/api/sync',{method:'PUT',body:JSON.stringify({state:cloudSafeState(),baseUpdatedAt:state.account.lastSyncedAt||null,force})});state.account.lastSyncedAt=response.updatedAt;state.syncMeta={...state.syncMeta,pending:false,status:'synced',lastAutoSync:new Date().toISOString(),lastError:''};persistOrbitLocal();render();if(!silent)toast(L('داده‌ها با ابر همگام شدند.','Data synced to cloud.'));
  }catch(error){
    if(error.status===409&&!force){state.syncMeta={...state.syncMeta,pending:true,status:'conflict',lastError:error.message};persistOrbitLocal();if(!silent&&window.confirm(L('نسخهٔ جدیدتری در ابر هست. نسخهٔ محلی جای آن را بگیرد؟','A newer cloud version exists. Replace it with this local version?')))return syncCloud('upload',true,false);if(!silent)toast(L('تعارض نسخه نیاز به تصمیم شما دارد.','A version conflict needs your decision.'));return}
    state.syncMeta={...state.syncMeta,pending:true,status:'offline',lastError:error.message};persistOrbitLocal();if(!silent)toast(error.message);
  }finally{orbitSyncInFlight=false}
}
function focusSessionDate(value){return String(value||'').slice(0,10)||todayISO()}
function recordFocusSession(taskId,minutes){const task=taskById(taskId),session={id:Date.now()+Math.floor(Math.random()*1000),taskId:Number(taskId)||null,subject:task?.learning?.subject||task?.category||L('عمومی','General'),minutes:Math.max(1,Number(minutes)||1),endedAt:new Date().toISOString()};state.focusSessions.unshift(session);state.focusSessions=state.focusSessions.slice(0,1000);state.focusMinutes=(Number(state.focusMinutes)||0)+session.minutes;return session}
function setDuration(duration){state.timer.duration=duration;state.timer.seconds=duration*60;state.timer.active=false;state.timer.sessionStartedAt='';clearInterval(timerHandle);timerHandle=null;render();save()}
function toggleTimer(){if(!state.timer.taskId){toast(state.lang==='fa'?'اول یک کار برای جلسه انتخاب کن.':'Choose a task for this session first.');return}state.timer.active=!state.timer.active;if(state.timer.active){state.timer.sessionStartedAt=state.timer.sessionStartedAt||new Date().toISOString();timerHandle=setInterval(tick,1000)}else{clearInterval(timerHandle);timerHandle=null}render();save()}
function tick(){state.timer.seconds--;if(state.timer.seconds<=0){clearInterval(timerHandle);timerHandle=null;state.timer.active=false;state.timer.seconds=state.timer.duration*60;state.timer.sessionStartedAt='';const task=taskById(state.timer.taskId);recordFocusSession(state.timer.taskId,state.timer.duration);if(task){task.done=true;task.skipped=false;task.completedAt=new Date().toISOString();createRecurringFollowUp(task)}save();render();toast(t('completedSession'));return}if(state.timer.seconds%10===0)save();const number=document.querySelector?.('.timer-number');if(number)number.textContent=formatTime(state.timer.seconds);const clock=document.querySelector?.('.focus-clock');if(clock)clock.textContent=formatTime(state.timer.seconds)}
function resetTimer(){clearInterval(timerHandle);timerHandle=null;state.timer.active=false;state.timer.seconds=state.timer.duration*60;state.timer.sessionStartedAt='';render();save()}
function syncMetaLabel(){const meta=state.syncMeta||{};if(!state.account?.token)return L('فقط محلی','Local only');if(meta.status==='syncing')return L('در حال همگام‌سازی…','Syncing…');if(meta.status==='queued')return L('صف همگام‌سازی','Sync queued');if(meta.status==='conflict')return L('تعارض نسخه','Sync conflict');if(meta.status==='offline')return L('در انتظار اینترنت','Waiting for network');return meta.lastAutoSync?L('همگام','Synced'):'Cloud ready'}
function attachGrowthListeners(){if(typeof window==='undefined'||!window.addEventListener)return;window.addEventListener('online',()=>{if(state.syncMeta?.pending)syncCloud('upload',false,true)});document.addEventListener('visibilitychange',()=>{if(!document.hidden&&state.syncMeta?.pending)syncCloud('upload',false,true)})}
ensureGrowthState();attachGrowthListeners();


/* Official calendar OAuth client. Provider credentials are intentionally required server-side. */
async function startOfficialCalendarOAuth(provider){
  if(!state.account?.token){toast(L('ابتدا وارد حساب Cloud شو.','Sign in to Cloud first.'));return}
  try{const result=await cloudRequest(`/api/calendar/${provider}/start`,{method:'POST',body:'{}'});window.location.assign(result.url)}catch(error){toast(error.message)}
}
async function syncOfficialCalendar(provider){
  if(!state.account?.token){toast(L('ابتدا وارد حساب Cloud شو.','Sign in to Cloud first.'));return}
  try{const result=await cloudRequest(`/api/calendar/${provider}/sync`,{method:'POST',body:'{}'});if(result.state)applyRestoredState(result.state);state.calendarConnections={...(state.calendarConnections||{}),[provider]:{connected:true,lastSyncedAt:result.updatedAt||new Date().toISOString()}};save();render();toast(L(`${uiNumber(result.written)} رویداد ارسال و ${uiNumber(result.pulled||0)} تغییر دریافت شد.`,`${result.written} events sent and ${result.pulled||0} changes received.`))}catch(error){toast(error.message)}
}
async function refreshCalendarConnectionStatus(){
  if(!state.account?.token)return;for(const provider of ['google','microsoft']){try{const value=await cloudRequest(`/api/calendar/${provider}/status`);state.calendarConnections={...(state.calendarConnections||{}),[provider]:value}}catch(error){}}
  persistOrbitLocal?.();render();
}
function handleCalendarOAuthReturn(){
  if(typeof window==='undefined'||!window.location?.search)return;const query=new URLSearchParams(window.location.search);if(query.get('calendar')!=='connected')return;const provider=query.get('provider');if(provider){state.calendarConnections={...(state.calendarConnections||{}),[provider]:{connected:true,lastSyncedAt:new Date().toISOString()}};toast(L(`اتصال ${provider==='google'?'Google Calendar':'Outlook'} با موفقیت برقرار شد.`,`Connected to ${provider==='google'?'Google Calendar':'Outlook'} successfully.`));if(window.history?.replaceState)window.history.replaceState({},document.title,window.location.pathname)}
}
handleCalendarOAuthReturn();

function weekDateRangeLabel(dates){

}

function weekTaskCard(task){const label=taskState(task),nextAction=label==='done'?L('بازگرداندن به انتظار','Mark pending'):L('انجام شد','Mark complete');return `<article class="week-task-card ${label}" onclick="openTaskEditor(${task.id})" role="button" tabindex="0" onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();openTaskEditor(${task.id})}"><button class="week-task-state" onclick="event.stopPropagation();markTaskStatus(${task.id},'done')" aria-label="${nextAction}" title="${nextAction}">${label==='done'?'✓':label==='missed'?'!':'○'}</button><div><b>${esc(localized(task))}</b><small><bdi>${task.time}</bdi> · ${uiNumber(task.duration)} ${L('دقیقه','min')}</small></div></article>`}
function weekBoard(){const dates=planningWeek(),total=dates.reduce((sum,date)=>sum+rangeTasks(date,date).length,0),done=dates.reduce((sum,date)=>sum+rangeTasks(date,date).filter(task=>task.done).length,0);return `<div class="weekly-planner"><header class="weekly-planner-toolbar"><div><span class="planner-kicker">${L('هفتهٔ انتخاب‌شده','SELECTED WEEK')}</span><h3>${weekDateRangeLabel(dates)}</h3><small>${L(`${uiNumber(done)} از ${uiNumber(total)} کار تکمیل شده`,`${done} of ${total} tasks complete`)}</small></div><div class="weekly-nav-actions"><button class="week-nav" onclick="shiftPlanningWeek(-1)" aria-label="${L('هفتهٔ قبل','Previous week')}">‹</button><button class="week-today" onclick="jumpToPlanningToday()">${L('امروز','Today')}</button><button class="week-nav" onclick="shiftPlanningWeek(1)" aria-label="${L('هفتهٔ بعد','Next week')}">›</button></div></header><div class="week-board" aria-label="${L('برنامهٔ هفتگی','Weekly plan')}">${dates.map(iso=>{const tasks=rangeTasks(iso,iso).sort((a,b)=>a.time.localeCompare(b.time)),today=iso===todayISO(),selected=iso===state.planDate,visible=tasks.slice(0,3);return `<section class="week-day ${today?'today':''} ${selected?'selected':''}" ondragover="event.preventDefault();this.classList.add('drag-over')" ondragleave="this.classList.remove('drag-over')" ondrop="this.classList.remove('drag-over');dropTaskOnDate(event,'${iso}')"><header><button class="week-date-trigger" onclick="openWeekDay('${iso}')" aria-label="${L('بازکردن برنامهٔ روز','Open daily plan')} ${localizedDate(iso,{weekday:'long',day:'numeric',month:'long'})}"><span>${localizedDate(iso,{weekday:'short'})}</span><b>${localizedDate(iso,{day:'numeric'})}</b></button><i>${tasks.length?uiNumber(tasks.length):'+'}</i></header><div class="week-day-tasks">${visible.length?visible.map(weekTaskCard).join(''):`<button class="week-free" onclick="openPlanDate('${iso}')">${L('فضای آزاد','Open space')}</button>`}${tasks.length>3?`<button class="week-more" onclick="openWeekDay('${iso}')">${L(`+${uiNumber(tasks.length-3)} کار دیگر`,`+${tasks.length-3} more`)}</button>`:''}</div><button class="plan-add" onclick="openPlanDate('${iso}')" aria-label="${L('افزودن کار به این روز','Add task to this day')}">＋ <span>${L('افزودن','Add')}</span></button></section>`}).join('')}</div><p class="weekly-help">${L('برای دیدن روز، روی تاریخ بزن؛ task را برای ویرایش لمس کن، دایرهٔ کنار آن وضعیت را عوض می‌کند، یا task را روی یک روز دیگر رها کن.','Select a date for its day plan; tap a task to edit, use its circle for status, or drag a task onto another day.')}</p></div>`}


/* Advanced workspace: projects, Kanban, dependencies, capacity, and shareable project bundles. */
function projectColor(index=0){return ['violet','blue','mint','coral','amber'][Math.abs(Number(index)||0)%5]}
function normalizeProject(project={}){return {id:project.id||`project-${Date.now()}-${Math.floor(Math.random()*10000)}`,name:String(project.name||L('پروژهٔ بدون نام','Untitled project')).slice(0,100),description:String(project.description||'').slice(0,600),deadline:/^\d{4}-\d{2}-\d{2}$/.test(String(project.deadline||''))?project.deadline:'',color:project.color||projectColor(state.projects?.length||0),dailyCapacityMinutes:Math.max(30,Math.min(720,Number(project.dailyCapacityMinutes)||120)),milestones:Array.isArray(project.milestones)?project.milestones.slice(0,8):String(project.milestones||'').split(/[،,;\n]+/).map(x=>x.trim()).filter(Boolean).slice(0,8),members:Array.isArray(project.members)?project.members.slice(0,8):String(project.members||'').split(/[،,;\n]+/).map(x=>x.trim()).filter(Boolean).slice(0,8),createdAt:project.createdAt||new Date().toISOString()}}
function ensureAdvancedWorkspace(){state.projects=Array.isArray(state.projects)?state.projects.map(normalizeProject):[];state.activeProjectId=state.activeProjectId||state.projects[0]?.id||'';state.projectBoardView=['board','timeline'].includes(state.projectBoardView)?state.projectBoardView:'board';state.planningEnergy=['low','balanced','high'].includes(state.planningEnergy)?state.planningEnergy:'balanced';state.tasks=state.tasks.map(task=>({...task,projectId:task.projectId||'',stage:['backlog','doing','done'].includes(task.stage)?task.stage:(task.done?'done':'backlog'),blockedBy:Array.isArray(task.blockedBy)?task.blockedBy:[]}));}
function projectById(id){return state.projects.find(project=>String(project.id)===String(id))}
function projectTasks(id){return state.tasks.filter(task=>String(task.projectId||'')===String(id))}
function isTaskBlocked(task){return (task.blockedBy||[]).some(id=>!taskById(id)?.done)}
function projectCompletion(project){const tasks=projectTasks(project.id),done=tasks.filter(task=>task.done).length;return {tasks,done,pct:tasks.length?Math.round(done/tasks.length*100):0,minutes:tasks.filter(task=>!task.done).reduce((sum,task)=>sum+Number(task.duration||0),0)}}
function defaultTaskDraft(date=todayISO()){return {title:'',category:'Study',date,time:'17:00',duration:45,priority:'Medium',notes:'',link:'',tags:[],subtasks:[],recurrence:'none',recurrenceDays:[],recurrenceEnd:'',reminderMinutes:0,projectId:'',stage:'backlog',blockedBy:[]}}

function saveTask(event){event.preventDefault();captureTaskDraft();const draft=normalizeTask(state.taskDraft||{}),title=String(draft.title||'').trim();if(!title)return;const editing=state.editingTaskId!==null&&state.editingTaskId!==undefined;if(editing){const original=taskById(state.editingTaskId);if(!original)return;const scope=state.recurrenceEditScope||'this',root=recurrenceRoot(original);const common={title,titleEn:original.titleEn||title,category:draft.category,time:draft.time,duration:draft.duration,priority:draft.priority,notes:draft.notes,link:draft.link,tags:draft.tags,subtasks:draft.subtasks,recurrence:draft.recurrence,recurrenceDays:draft.recurrenceDays,recurrenceEnd:draft.recurrenceEnd,reminderMinutes:draft.reminderMinutes,projectId:draft.projectId,stage:draft.stage||'backlog',blockedBy:draft.blockedBy||[],recurrenceSpawned:false};state.tasks=state.tasks.map(task=>{const selected=String(task.id)===String(original.id),related=recurrenceRoot(task)===root&&(scope==='series'||(scope==='future'&&task.date>=original.date));if(!selected&&!related)return task;return normalizeTask(selected?{...task,...common,date:draft.date}:{...task,...common})});toast(scope==='this'?L('تغییرات این جلسه ذخیره شد.','This occurrence was updated.'):L('تغییرات مجموعهٔ تکرار ذخیره شد.','Recurring series updated.'))}else{state.tasks.push(normalizeTask({id:Date.now(),title,titleEn:title,...draft,done:false,skipped:false,stage:draft.stage||'backlog'}));toast(L('کار به برنامه اضافه شد.','Task added to your plan.'))}state.modal='';state.taskDraft=null;state.editingTaskId=null;state.draftDate='';state.filter='All';save();render()}

function autoScheduleProject(projectId){const project=projectById(projectId);if(!project)return;const capacity=Math.round(project.dailyCapacityMinutes*energyMultiplier()),tasks=projectTasks(projectId).filter(task=>!task.done&&!isTaskBlocked(task)).sort((a,b)=>({High:0,Medium:1,Low:2}[a.priority]||1)-({High:0,Medium:1,Low:2}[b.priority]||1)||Number(b.duration)-Number(a.duration));if(!tasks.length){toast(L('کار آماده‌ای برای زمان‌بندی نیست.','No ready tasks need scheduling.'));return}const load={},dates=Array.from({length:31},(_,index)=>isoFromToday(index));state.tasks.filter(task=>task.projectId===projectId&&task.date>=todayISO()&&!task.done).forEach(task=>load[task.date]=(load[task.date]||0)+Number(task.duration||0));let scheduled=0;for(const task of tasks){const date=dates.find(day=>(load[day]||0)+Number(task.duration||0)<=capacity);if(!date)break;const used=load[date]||0;load[date]=used+Number(task.duration||0);task.date=date;task.time=projectSlotTime(Math.floor(used/60));task.stage=task.stage==='backlog'?'doing':task.stage;scheduled++}save();render();toast(L(`${uiNumber(scheduled)} کار با ظرفیت ${focusDuration(capacity)} در روز زمان‌بندی شد.`,`${scheduled} tasks were scheduled at ${capacity} minutes/day capacity.`))}

/* Learning Pro: exam targets, weakness radar, and short retrieval drills. */
function ensureLearningProState(){state.examTargets=Array.isArray(state.examTargets)?state.examTargets.map(normalizeExamTarget):[];state.examDrill=state.examDrill&&typeof state.examDrill==='object'?state.examDrill:null}
function normalizeExamTarget(exam={}){return {id:exam.id||`exam-${Date.now()}-${Math.floor(Math.random()*1000)}`,subject:String(exam.subject||L('عمومی','General')).slice(0,80),date:/^\d{4}-\d{2}-\d{2}$/.test(String(exam.date||''))?exam.date:isoFromToday(30),goal:Number(exam.goal)||20,history:Array.isArray(exam.history)?exam.history.slice(-30):[],createdAt:exam.createdAt||new Date().toISOString()}}
function subjectMastery(subject){const records=Object.entries(state.mastery||{}).filter(([key])=>key.startsWith(`${subject}::`)).map(([,value])=>Number(value.level||0));return records.length?Math.round(records.reduce((sum,value)=>sum+value,0)/(records.length*2)*100):0}
function subjectWeaknesses(){const map=new Map();for(const card of state.flashcards||[]){const item=map.get(card.subject)||{subject:card.subject,score:0,errors:0,lapses:0,mastery:subjectMastery(card.subject)};item.lapses+=Number(card.lapses||0);map.set(card.subject,item)}for(const log of state.errorLogs||[]){const subject=log.subject||L('عمومی','General'),item=map.get(subject)||{subject,score:0,errors:0,lapses:0,mastery:subjectMastery(subject)};item.errors++;map.set(subject,item)}for(const exam of state.examTargets||[]){if(!map.has(exam.subject))map.set(exam.subject,{subject:exam.subject,score:0,errors:0,lapses:0,mastery:subjectMastery(exam.subject)})}return [...map.values()].map(item=>({...item,score:Math.min(100,Math.max(0,100-item.mastery+item.errors*10+item.lapses*8))})).sort((a,b)=>b.score-a.score).slice(0,5)}
function examReadiness(exam){const mastery=subjectMastery(exam.subject),cards=(state.flashcards||[]).filter(card=>card.subject===exam.subject),lapses=cards.reduce((sum,card)=>sum+Number(card.lapses||0),0),recent=exam.history.slice(-5),accuracy=recent.length?Math.round(recent.reduce((sum,item)=>sum+item.score,0)/recent.length*100):mastery;return Math.max(0,Math.min(100,Math.round(mastery*.55+accuracy*.35-Math.min(20,lapses*3))))}
function saveExamTarget(event){event.preventDefault();const subject=String(document.getElementById('examSubject')?.value||'').trim();if(!subject)return;const target=normalizeExamTarget({subject,date:document.getElementById('examDate')?.value,goal:Number(document.getElementById('examGoal')?.value)});state.examTargets.push(target);save();render();toast(L('هدف آزمون و مسیر مرور ثبت شد.','Exam target and review path created.'))}
function deleteExamTarget(id){if(!window.confirm(L('این هدف آزمون حذف شود؟','Delete this exam target?')))return;state.examTargets=state.examTargets.filter(exam=>String(exam.id)!==String(id));save();render()}
function drillCardsFor(exam){const cards=(state.flashcards||[]).filter(card=>card.subject===exam.subject);if(cards.length)return cards.sort((a,b)=>a.dueDate.localeCompare(b.dueDate)).slice(0,Math.min(5,exam.goal));const skills=Object.keys(state.mastery||{}).filter(key=>key.startsWith(`${exam.subject}::`)).map(key=>key.split('::')[1]);return skills.slice(0,5).map((skill,index)=>({id:`prompt-${index}`,subject:exam.subject,front:L(`بدون نگاه‌کردن، «${skill}» را توضیح بده.`,`Explain “${skill}” without looking.`),back:L('پاسخ را با منبع خودت مقایسه کن و صادقانه امتیاز بده.','Compare your answer with your source and score it honestly.')}))}
function startExamDrill(id){const exam=state.examTargets.find(item=>String(item.id)===String(id));if(!exam)return;const cards=drillCardsFor(exam);if(!cards.length){toast(L('برای این موضوع ابتدا فلش‌کارت یا mastery ثبت کن.','Add flashcards or mastery records for this subject first.'));return}state.examDrill={examId:exam.id,cards,index:0,revealed:false,correct:0};render()}
function revealExamDrill(){if(!state.examDrill)return;state.examDrill={...state.examDrill,revealed:true};render()}
function gradeExamDrill(correct){const drill=state.examDrill;if(!drill)return;const nextIndex=drill.index+1,nextCorrect=drill.correct+(correct?1:0);if(nextIndex>=drill.cards.length){const exam=state.examTargets.find(item=>String(item.id)===String(drill.examId));if(exam)exam.history.push({date:todayISO(),score:Math.round(nextCorrect/drill.cards.length*100),count:drill.cards.length});state.examDrill=null;save();render();toast(L('نتیجهٔ drill در آمادگی آزمون ثبت شد.','Drill result recorded in exam readiness.'));return}state.examDrill={...drill,index:nextIndex,revealed:false,correct:nextCorrect};render()}
function stopExamDrill(){state.examDrill=null;render()}
function addWeaknessReview(subject){const todayTasks=state.tasks.filter(task=>task.date===todayISO()).reduce((sum,task)=>sum+Number(task.duration||0),0);const date=todayTasks<360?todayISO():isoFromToday(1);state.tasks.push(normalizeTask({id:Date.now(),title:`${subject} · ${L('مرور نقطهٔ ضعف','Weakness review')}`,titleEn:`${subject} · Weakness review`,category:'Study',date,time:'18:00',duration:30,priority:'High',tags:[L('نقطه ضعف','weakness')],learning:{subject,skill:L('بازیابی هدفمند','Targeted retrieval'),strategy:L('بازیابی فعال و تحلیل خطا','Active recall and error analysis'),type:'review'}}));save();render();toast(L('یک مرور هدفمند به برنامه اضافه شد.','A targeted review was added to the plan.'))}
function examDrillMarkup(){const drill=state.examDrill;if(!drill)return'';const card=drill.cards[drill.index],progress=Math.round((drill.index)/drill.cards.length*100);return `<section class="exam-drill"><header><div><span>${L('تمرین بازیابی آزمون','EXAM RETRIEVAL DRILL')}</span><b>${L(`کارت ${uiNumber(drill.index+1)} از ${uiNumber(drill.cards.length)}`,`Card ${drill.index+1} of ${drill.cards.length}`)}</b></div><button class="text-action" onclick="stopExamDrill()">${L('پایان','End')}</button></header><i><em style="width:${progress}%"></em></i><h3>${esc(card.front)}</h3>${drill.revealed?`<div class="exam-drill-answer">${esc(card.back).replace(/\n/g,'<br>')}</div><div class="exam-drill-actions"><button class="quiet" onclick="gradeExamDrill(false)">${L('نادرست / ناقص','Incorrect / partial')}</button><button class="primary" onclick="gradeExamDrill(true)">${L('درست','Correct')}</button></div>`:`<button class="quiet reveal-card" onclick="revealExamDrill()">${L('نمایش پاسخ و امتیازدهی','Reveal answer & score')}</button>`}</section>`}
function learningProMarkup(){const weaknesses=subjectWeaknesses(),drill=examDrillMarkup();return `<section class="learning-pro">${drill}<div class="learning-pro-head"><div><span class="learn-kicker">${L('آمادگی آزمون','EXAM READINESS')}</span><h2>${L('هدف را به تمرین هدفمند تبدیل کن','Turn deadlines into targeted practice')}</h2><p>${L('نقطه‌های ضعف از mastery، دفتر خطا و lapseهای فلش‌کارت جمع می‌شوند.','Weaknesses combine mastery, error logs, and flashcard lapses.')}</p></div></div><div class="learning-pro-grid"><section class="exam-targets"><h3>${L('هدف‌های آزمون','Exam targets')}</h3><form onsubmit="saveExamTarget(event)"><input id="examSubject" required maxlength="80" placeholder="${L('موضوع آزمون','Exam subject')}"><input id="examDate" type="date" value="${isoFromToday(30)}"><input id="examGoal" type="number" min="3" max="100" value="20" title="${L('تعداد پرسش drill','Drill questions')}"><button class="quiet" type="submit">＋ ${L('افزودن','Add')}</button></form><div class="exam-target-list">${state.examTargets.length?state.examTargets.map(exam=>{const days=Math.max(0,Math.ceil((asDate(exam.date)-asDate(todayISO()))/86400000)),readiness=examReadiness(exam);return `<article><div><b>${esc(exam.subject)}</b><small>${L(`${uiNumber(days)} روز تا آزمون`,` ${days} days to exam`)} · ${L('آمادگی','readiness')} ${uiPercent(readiness)}</small><i><em style="width:${readiness}%"></em></i></div><button class="quiet" onclick="startExamDrill('${exam.id}')">${L('drill','Drill')}</button><button class="text-action danger" onclick="deleteExamTarget('${exam.id}')">×</button></article>`}).join(''):`<p>${L('یک آزمون یا deadline اضافه کن تا مسیر آمادگی ساخته شود.','Add an exam or deadline to build a readiness path.')}</p>`}</div></section><section class="weakness-radar"><h3>${L('رادار نقطهٔ ضعف','Weakness radar')}</h3>${weaknesses.length?weaknesses.map(item=>`<article><div><b>${esc(item.subject)}</b><small>${L(`تسلط ${uiPercent(item.mastery)} · ${uiNumber(item.errors)} خطا · ${uiNumber(item.lapses)} lapse`,`Mastery ${item.mastery}% · ${item.errors} errors · ${item.lapses} lapses`)}</small></div><strong>${uiPercent(item.score)}</strong><button class="text-action" onclick="addWeaknessReview(decodeURIComponent('${encodeURIComponent(item.subject)}'))">＋ ${L('مرور','Review')}</button></article>`).join(''):`<div class="pro-empty">${L('با ثبت mastery، خطا یا فلش‌کارت، رادار اینجا فعال می‌شود.','Log mastery, errors, or flashcards to activate the radar.')}</div>`}</section></div></section>`}
