/* OrbitPlan Connected Collaboration — explicit publish, invite, pull, and revision-safe push. */
function ensureCollaborationState(){
  state.collaboration=state.collaboration&&typeof state.collaboration==='object'?state.collaboration:{bindings:{}};
  state.collaboration.bindings=state.collaboration.bindings&&typeof state.collaboration.bindings==='object'?state.collaboration.bindings:{};
  state.collaboration.activity=state.collaboration.activity&&typeof state.collaboration.activity==='object'?state.collaboration.activity:{};
}
function projectCollaboration(projectId){ensureCollaborationState();return state.collaboration.bindings[String(projectId)]||null}
function collaborationRoleLabel(role){return L(({owner:'مالک',editor:'ویرایشگر',viewer:'فقط مشاهده'})[role]||'عضو',({owner:'Owner',editor:'Editor',viewer:'Viewer'})[role]||'Member')}
function collaborationPayload(project){
  const binding=projectCollaboration(project.id);
  return {project:{...project,id:binding?.remoteId||project.id},tasks:projectTasks(project.id).map(task=>{const copy={...task,id:task.collabRemoteId||task.id};delete copy.projectId;delete copy.collabRemoteId;return copy})};
}
function bindSharedProject(localId,remote,role){
  ensureCollaborationState();const previous=state.collaboration.bindings[String(localId)]||{};state.collaboration.bindings[String(localId)]={...previous,remoteId:remote.id,revision:Number(remote.revision)||1,role:role||remote.members?.[state.account?.email]?.role||previous.role||'viewer',updatedAt:remote.updatedAt||'',updatedBy:remote.updatedBy||'',invites:remote.invites||previous.invites||{}};
}
function applySharedProject(remote, localId){
  const saved=projectById(localId);if(!saved)throw new Error('Local project not found.');
  const normalized=normalizeProject({...remote.payload.project,id:localId,createdAt:saved.createdAt});Object.assign(saved,normalized,{id:localId});
  const current=projectTasks(localId), byRemote=new Map(current.filter(task=>task.collabRemoteId!==undefined).map(task=>[String(task.collabRemoteId),task]));
  const received=Array.isArray(remote.payload?.tasks)?remote.payload.tasks:[], live=new Set();
  received.forEach((remoteTask,index)=>{const remoteId=String(remoteTask.id),old=byRemote.get(remoteId),localTask=normalizeTask({...remoteTask,id:old?.id||Date.now()+index+1,projectId:localId,collabRemoteId:remoteTask.id});live.add(String(localTask.id));if(old)Object.assign(old,localTask);else state.tasks.push(localTask)});
  state.tasks=state.tasks.filter(task=>String(task.projectId)!==String(localId)||!task.collabRemoteId||live.has(String(task.id)));
  bindSharedProject(localId,remote);save();render();
}
async function publishProjectToTeam(localId){
  const project=projectById(localId);if(!project)return;if(!state.account?.token){toast(L('برای همکاری ابتدا وارد حساب شو.','Sign in before collaborating.'));return}if(projectCollaboration(localId)){return pushSharedProject(localId)}
  try{const result=await cloudRequest('/api/collab/projects',{method:'POST',body:JSON.stringify(collaborationPayload(project))});bindSharedProject(localId,result.project,'owner');save();render();toast(L(`پروژه منتشر شد. کد دعوت: ${result.inviteCode}` ,`Project published. Invite code: ${result.inviteCode}`));copyInviteCode(result.inviteCode)}catch(error){toast(error.message)}
}
async function pushSharedProject(localId){
  const project=projectById(localId),binding=projectCollaboration(localId);if(!project||!binding)return;if(!['owner','editor'].includes(binding.role)){toast(L('این نقش فقط اجازهٔ مشاهده دارد.','This role is view only.'));return}
  try{const result=await cloudRequest(`/api/collab/projects/${encodeURIComponent(binding.remoteId)}`,{method:'PUT',body:JSON.stringify({payload:collaborationPayload(project),baseRevision:binding.revision})});applySharedProject(result.project,localId);toast(L('تغییرهای تیمی ارسال شد.','Team changes pushed.'))}catch(error){if(error.status===409&&error.payload?.project){if(window.confirm(L('نسخهٔ تازه‌تری در تیم هست. آن را دریافت کنیم؟','A newer team version exists. Pull it now?'))){applySharedProject(error.payload.project,localId);toast(L('نسخهٔ تیم دریافت شد؛ تغییرهای محلی ارسال‌نشده جایگزین شد.','Team version pulled; unsent local edits were replaced.'))}return}toast(error.message)}}
async function pullSharedProject(localId){
  const binding=projectCollaboration(localId);if(!binding)return;try{const result=await cloudRequest(`/api/collab/projects/${encodeURIComponent(binding.remoteId)}`);applySharedProject(result.project,localId);toast(L('آخرین نسخهٔ تیم دریافت شد.','Latest team version pulled.'))}catch(error){toast(error.message)}}
async function createTeamInvite(localId){
  const binding=projectCollaboration(localId);if(!binding||binding.role!=='owner'){toast(L('فقط مالک می‌تواند دعوت بسازد.','Only the owner can create invites.'));return}const viewer=window.confirm(L('برای نقش فقط‌مشاهده دعوت بسازی؟ «لغو» یعنی ویرایشگر.','Create a viewer invite? Cancel creates an editor invite.'));
  try{const result=await cloudRequest(`/api/collab/projects/${encodeURIComponent(binding.remoteId)}/invite`,{method:'POST',body:JSON.stringify({inviteRole:viewer?'viewer':'editor'})});binding.invites={...(binding.invites||{}),[result.code]:{role:result.role,expiresAt:result.expiresAt}};persistOrbitLocal();render();copyInviteCode(result.code);toast(L(`کد ${viewer?'مشاهده':'ویرایش'}: ${result.code}`,`${viewer?'Viewer':'Editor'} code: ${result.code}`))}catch(error){toast(error.message)}}
async function copyInviteCode(code){try{if(navigator.clipboard?.writeText){await navigator.clipboard.writeText(code);toast(L('کد دعوت در کلیپ‌بورد کپی شد.','Invite code copied to clipboard.'))}}catch(error){}}
async function joinTeamProject(){
  if(!state.account?.token){toast(L('برای پیوستن ابتدا وارد حساب شو.','Sign in before joining.'));return}const code=window.prompt(L('کد دعوت پروژه را وارد کن','Enter the project invite code'));if(!code)return;
  try{const result=await cloudRequest('/api/collab/projects/join',{method:'POST',body:JSON.stringify({code})});const remote=result.project,existing=Object.entries(state.collaboration?.bindings||{}).find(([,item])=>item.remoteId===remote.id);if(existing){state.activeProjectId=existing[0];bindSharedProject(existing[0],remote);save();render();toast(L('این پروژه پیش‌تر متصل شده است.','This project is already connected.'));return}const project=normalizeProject({...remote.payload.project,id:`project-${Date.now()}`});state.projects.push(project);state.activeProjectId=project.id;remote.payload.tasks?.forEach((task,index)=>state.tasks.push(normalizeTask({...task,id:Date.now()+index+1,projectId:project.id,collabRemoteId:task.id})));bindSharedProject(project.id,remote);save();render();toast(L('به پروژهٔ تیمی پیوستی.','Joined the team project.'))}catch(error){toast(error.message)}}
function teamActivityText(item){const names={'project.published':['پروژه منتشر شد','Project published'],'member.joined':['یک عضو به پروژه پیوست','A member joined the project'],'project.updated':['تغییرهای پروژه ارسال شد','Project changes were pushed'],'invite.created':['کد دعوت ساخته شد','Invite created'],'invite.revoked':['کد دعوت لغو شد','Invite revoked']};const text=names[item.action]||['رویداد تیمی ثبت شد','Team activity recorded'];return `${L(text[0],text[1])}${item.details?.role?` · ${collaborationRoleLabel(item.details.role)}`:''}`}
function teamActivityMarkup(localId){const items=state.collaboration?.activity?.[String(localId)]||[];return `<section class="team-audit"><header><b>${L('فعالیت‌های تیم','Team activity')}</b><button class="text-action" onclick="loadTeamActivity('${localId}')">${L('↻ تازه‌سازی','↻ Refresh')}</button></header>${items.length?items.slice(0,6).map(item=>`<article><i></i><div><strong>${esc(teamActivityText(item))}</strong><span>${esc(item.actorEmail||'—')} · ${esc(String(item.createdAt||'').replace('T',' ').slice(0,16))}</span></div></article>`).join(''):`<p class="data-footnote">${L('برای دیدن فعالیت‌ها تازه‌سازی را بزن.','Refresh to load project activity.')}</p>`}</section>`}
async function loadTeamActivity(localId){const binding=projectCollaboration(localId);if(!binding)return;try{const result=await cloudRequest(`/api/collab/projects/${encodeURIComponent(binding.remoteId)}/activity`);ensureCollaborationState();state.collaboration.activity[String(localId)]=Array.isArray(result.activity)?result.activity:[];persistOrbitLocal();render()}catch(error){toast(error.message)}}
async function revokeTeamInvite(localId,code){const binding=projectCollaboration(localId);if(!binding||binding.role!=='owner')return;if(!window.confirm(L('این کد دعوت لغو شود؟','Revoke this invite code?')))return;try{await cloudRequest(`/api/collab/projects/${encodeURIComponent(binding.remoteId)}/invite/${encodeURIComponent(code)}`,{method:'DELETE'});delete binding.invites?.[code];persistOrbitLocal();render();toast(L('کد دعوت لغو شد.','Invite code revoked.'))}catch(error){toast(error.message)}}
function inviteGovernanceMarkup(project,binding){if(binding.role!=='owner')return '';const invites=Object.entries(binding.invites||{});return `<section class="invite-governance"><b>${L('کدهای دعوت فعال','Active invite codes')}</b>${invites.length?invites.map(([code,invite])=>`<div><span>${esc(code)} · ${esc(collaborationRoleLabel(invite.role))}</span><button class="text-action danger" onclick="revokeTeamInvite('${project.id}','${code}')">${L('لغو','Revoke')}</button></div>`).join(''):`<p class="data-footnote">${L('کد فعالی نیست.','No active codes.')}</p>`}</section>`}
function collaborationPanelMarkup(project){
  const binding=projectCollaboration(project.id);if(!state.account?.token)return `<section class="collab-panel"><div class="collab-panel-head"><div><h3>${L('همکاری تیمی امن','Secure team collaboration')}</h3><p>${L('برای انتشار، دعوت با نقش و همگام‌سازی پروژه وارد حساب شو.','Sign in to publish, invite by role, and synchronize this project.')}</p></div><span class="collab-badge">${L('محلی','Local')}</span></div></section>`;
  if(!binding)return `<section class="collab-panel"><div class="collab-panel-head"><div><h3>${L('همکاری تیمی امن','Secure team collaboration')}</h3><p>${L('این پروژه هنوز خصوصی است. انتشار، یک کد دعوت و نسخه‌بندی تعارض ایجاد می‌کند.','This project is still private. Publishing creates an invite code and revision conflict protection.')}</p></div><span class="collab-badge">${L('خصوصی','Private')}</span></div><div class="collab-actions"><button class="primary" onclick="publishProjectToTeam('${project.id}')">${L('☁ انتشار برای تیم','☁ Publish for team')}</button><button class="quiet" onclick="joinTeamProject()">${L('◇ پیوستن با کد','◇ Join with code')}</button></div></section>`;
  return `<section class="collab-panel"><div class="collab-panel-head"><div><h3>${L('پروژهٔ تیمی متصل','Connected team project')}</h3><p>${L(`نقش شما: ${collaborationRoleLabel(binding.role)} · نسخه ${uiNumber(binding.revision)} · آخرین تغییر توسط ${binding.updatedBy||'—'}`,`Your role: ${collaborationRoleLabel(binding.role)} · revision ${binding.revision} · last change by ${binding.updatedBy||'—'}`)}</p></div><span class="collab-badge">${esc(collaborationRoleLabel(binding.role))}</span></div><div class="collab-actions"><button class="quiet" onclick="pullSharedProject('${project.id}')">↓ ${L('دریافت تغییرها','Pull changes')}</button>${['owner','editor'].includes(binding.role)?`<button class="primary" onclick="pushSharedProject('${project.id}')">↑ ${L('ارسال تغییرها','Push changes')}</button>`:''}${binding.role==='owner'?`<button class="quiet" onclick="createTeamInvite('${project.id}')">＋ ${L('کد دعوت','Invite code')}</button>`:''}</div>${inviteGovernanceMarkup(project,binding)}<div class="collab-info">${L('ارسال با نسخهٔ پایه انجام می‌شود؛ اگر هم‌زمان تغییر کنید، ابتدا نسخهٔ تیم را دریافت و تصمیم می‌گیری.','Pushes use a base revision; concurrent changes require you to pull and choose the team version first.')}</div>${teamActivityMarkup(project.id)}</section>`;
}
function projectBoard(project){return projectBoardBase(project)+collaborationPanelMarkup(project)}

/* Session security UI: password rotation and signed-token invalidation. */
async function cloudRequest(path,options={}){
  const headers={'content-type':'application/json',...(options.headers||{})};if(state.account?.token)headers.authorization=`Bearer ${state.account.token}`;
  const response=await fetch(`${cloudBase()}${path}`,{...options,headers});const payload=await response.json().catch(()=>({}));
  if(!response.ok){const error=new Error(payload.error||'Cloud request failed.');error.status=response.status;error.payload=payload;if(response.status===401&&state.account?.token){state.account={...state.account,token:'',status:'signed-out'};persistOrbitLocal();setTimeout(()=>render(),0)}throw error}return payload;
}
async function changeAccountPassword(){
  const currentPassword=document.getElementById('accountCurrentPassword')?.value||'',newPassword=document.getElementById('accountNewPassword')?.value||'',confirmPassword=document.getElementById('accountConfirmPassword')?.value||'';
  if(newPassword.length<10){toast(L('گذرواژهٔ تازه باید حداقل ۱۰ نویسه باشد.','New password must be at least 10 characters.'));return}if(newPassword!==confirmPassword){toast(L('تأیید گذرواژه یکسان نیست.','Password confirmation does not match.'));return}
  try{const result=await cloudRequest('/api/auth/password',{method:'POST',body:JSON.stringify({currentPassword,newPassword})});state.account={...state.account,...result.user,token:result.token,status:'signed-in'};save();render();toast(L('گذرواژه تغییر کرد؛ نشست‌های دیگر بی‌اعتبار شدند.','Password changed; other sessions were invalidated.'))}catch(error){toast(error.message)}
}
async function revokeOtherSessions(){
  if(!state.account?.token)return;if(!window.confirm(L('همهٔ نشست‌های دیگر از حساب خارج شوند؟','Sign out all other sessions?')))return;
  try{const result=await cloudRequest('/api/auth/revoke-sessions',{method:'POST',body:'{}'});state.account={...state.account,token:result.token,status:'signed-in'};save();render();toast(L('نشست‌های دیگر بی‌اعتبار شدند.','Other sessions were invalidated.'))}catch(error){toast(error.message)}
}
function securityPanelMarkup(){const signed=!!state.account?.token;return `<section class="data-panel"><h3>${L('حریم خصوصی و امنیت','Privacy & security')}</h3><div class="security-grid"><article><b>${L('پشتیبان رمزدار','Encrypted backup')}</b><p>${L('رمز فقط برای همین خروجی استفاده می‌شود و در OrbitPlan نگهداری نمی‌شود.','The passphrase is used only for this export and is not retained by OrbitPlan.')}</p><label>${L('گذرواژهٔ پشتیبان','Backup passphrase')}<input id="backupPassphrase" type="password" minlength="10" autocomplete="new-password" placeholder="${L('حداقل ۱۰ نویسه','at least 10 characters')}"></label><div class="security-actions"><button class="primary" onclick="exportEncryptedBackup()">⌁ ${L('خروجی رمزدار','Export encrypted')}</button><button class="quiet" type="button" onclick="document.getElementById('encryptedBackupFile').click()">⇧ ${L('بازیابی رمزدار','Restore encrypted')}</button><input id="encryptedBackupFile" type="file" accept="application/json" onchange="importBackup(event)" hidden></div></article><article><b>${L('اعلان و PWA','Notifications & PWA')}</b><p>${pwaReminderStatus()}</p><button class="quiet" onclick="requestReminderPermission()">◌ ${L('فعال‌سازی اعلان‌ها','Enable reminders')}</button></article><article><b>${L('حفاظت از تغییرهای مخرب','Destructive-action guard')}</b><p>${L('حذف task، فلش‌کارت و مجموعهٔ تکرار تأیید صریح می‌خواهند؛ دادهٔ واردشده نیز پیش از ذخیره نرمال‌سازی می‌شود.','Task, flashcard, and recurrence-series deletion require confirmation; imported data is normalized before storage.')}</p></article>${signed?`<article class="session-card"><b>${L('نشست‌ها و گذرواژه','Sessions & password')}</b><p>${L('تغییر گذرواژه یا خروج از نشست‌های دیگر، توکن‌های قبلی را فوراً بی‌اعتبار می‌کند.','Changing the password or revoking other sessions invalidates previous tokens immediately.')}</p><div class="account-security-form"><input id="accountCurrentPassword" type="password" autocomplete="current-password" placeholder="${L('گذرواژهٔ فعلی','Current password')}"><input id="accountNewPassword" type="password" minlength="10" autocomplete="new-password" placeholder="${L('گذرواژهٔ تازه (۱۰+ نویسه)','New password (10+ chars)')}"><input id="accountConfirmPassword" type="password" minlength="10" autocomplete="new-password" placeholder="${L('تأیید گذرواژهٔ تازه','Confirm new password')}"><div class="security-actions"><button class="primary" onclick="changeAccountPassword()">${L('تغییر گذرواژه','Change password')}</button><button class="quiet danger-quiet" onclick="revokeOtherSessions()">${L('خروج از نشست‌های دیگر','Sign out other sessions')}</button></div></div></article>`:`<article class="session-card"><b>${L('نشست‌ها و گذرواژه','Sessions & password')}</b><p>${L('بعد از ورود، تغییر گذرواژه و بی‌اعتبارسازی نشست‌های دیگر این‌جا فعال می‌شود.','After sign-in, password rotation and other-session invalidation are available here.')}</p></article>`}</div></section>`}
